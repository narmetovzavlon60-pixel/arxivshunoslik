<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2481cc">
<title>Архивоведение — учебный курс</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg: var(--tg-theme-bg-color, #f2f2f6);
    --card: var(--tg-theme-secondary-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #111111);
    --hint: var(--tg-theme-hint-color, #707579);
    --btn: var(--tg-theme-button-color, #2481cc);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
    --link: var(--tg-theme-link-color, #2481cc);
    --line: rgba(127,127,127,.18);
    --ok: #34c759;
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 8px 24px -12px rgba(0,0,0,.12);
    --sat: env(safe-area-inset-top, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
  }
  html[data-scheme="dark"]{ --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 28px -12px rgba(0,0,0,.6); --line: rgba(255,255,255,.12); }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:var(--bg); color:var(--text);
    font-size:15.5px; line-height:1.55;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  #app{ max-width:680px; margin:0 auto; min-height:100dvh; padding-bottom:calc(24px + var(--sab)); }

  /* ---------- TOP BAR ---------- */
  .topbar{
    position:sticky; top:0; z-index:50;
    backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    background:color-mix(in srgb, var(--bg) 78%, transparent);
    border-bottom:1px solid var(--line);
  }
  .topbar-in{
    display:flex; align-items:center; gap:10px;
    padding:12px 16px; padding-top:calc(12px + var(--sat));
  }
  .tb-logo{
    width:34px; height:34px; border-radius:10px; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
    background:var(--btn); color:var(--btn-text);
    box-shadow:var(--shadow);
  }
  .tb-title{ flex:1; min-width:0; }
  .tb-title b{ display:block; font-size:15px; letter-spacing:-.2px; }
  .tb-title span{ display:block; font-size:11.5px; color:var(--hint); margin-top:-1px; }
  .tb-pct{ font-size:12px; font-weight:700; color:var(--btn); background:color-mix(in srgb, var(--btn) 12%, transparent); padding:5px 10px; border-radius:999px; }
  .tb-back{
    display:flex; align-items:center; gap:4px; border:none; cursor:pointer;
    background:color-mix(in srgb, var(--btn) 12%, transparent); color:var(--btn);
    font-size:13px; font-weight:600; padding:7px 12px 7px 9px; border-radius:999px;
  }
  main{ padding:16px; animation:viewIn .28s ease both; }
  @keyframes viewIn{ from{ opacity:0; transform:translateY(10px);} to{ opacity:1; transform:none;} }

  /* ---------- HERO ---------- */
  .hero{
    position:relative; overflow:hidden; border-radius:20px; color:#fff;
    background:var(--btn);
    background-image:linear-gradient(135deg, rgba(255,255,255,.16) 0%, rgba(255,255,255,0) 45%, rgba(0,0,0,.22) 100%);
    box-shadow:var(--shadow);
    padding:20px;
  }
  .hero::after{
    content:""; position:absolute; inset:0; pointer-events:none; opacity:.25;
    background-image:radial-gradient(rgba(255,255,255,.5) 1px, transparent 1px);
    background-size:18px 18px;
    mask-image:linear-gradient(115deg, transparent 40%, #000);
    -webkit-mask-image:linear-gradient(115deg, transparent 40%, #000);
  }
  .hero-row{ display:flex; align-items:center; gap:18px; position:relative; z-index:1; }
  .ring{ flex:0 0 auto; }
  .ring circle{ fill:none; stroke-width:6; stroke-linecap:round; }
  .ring .trk{ stroke:rgba(255,255,255,.32); }
  .ring .prg{ stroke:#fff; transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1); transform:rotate(-90deg); transform-origin:center; }
  .ring text{ fill:#fff; font-weight:800; }
  .hero h1{ margin:0 0 4px; font-size:19px; letter-spacing:-.3px; }
  .hero p{ margin:0; font-size:12.5px; opacity:.85; }
  .hero-stats{ display:flex; gap:16px; margin-top:10px; }
  .hstat b{ display:block; font-size:17px; }
  .hstat span{ font-size:11px; opacity:.8; }

  /* ---------- SEARCH ---------- */
  .search{
    margin:16px 0 6px; display:flex; align-items:center; gap:9px;
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:11px 13px; box-shadow:var(--shadow);
  }
  .search svg{ color:var(--hint); flex:0 0 auto; }
  .search input{
    flex:1; min-width:0; border:none; outline:none; background:none;
    color:var(--text); font-size:15px; font-family:inherit;
  }
  .search input::placeholder{ color:var(--hint); }
  .s-clear{ border:none; background:var(--line); color:var(--hint); width:22px; height:22px; border-radius:50%; cursor:pointer; display:none; align-items:center; justify-content:center; font-size:12px; }
  .s-meta{ font-size:12px; color:var(--hint); margin:2px 2px 10px; display:none; }

  /* ---------- LECTURE CARDS ---------- */
  .sec-label{ font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.6px; color:var(--hint); margin:14px 2px 8px; display:flex; justify-content:space-between; align-items:center; }
  .lec{
    display:flex; align-items:center; gap:13px; width:100%; text-align:left;
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:14px 14px; margin-bottom:10px; cursor:pointer; box-shadow:var(--shadow);
    transition:transform .15s ease, opacity .3s ease;
    color:var(--text); font-family:inherit;
  }
  .lec:active{ transform:scale(.985); }
  .lec-num{
    width:44px; height:44px; border-radius:13px; flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:16px; font-variant-numeric:tabular-nums;
    background:color-mix(in srgb, var(--btn) 12%, transparent); color:var(--btn);
  }
  .lec.done .lec-num{ background:color-mix(in srgb, var(--ok) 16%, transparent); color:var(--ok); }
  .lec-info{ flex:1; min-width:0; }
  .lec-info h3{ margin:0 0 3px; font-size:14.5px; font-weight:650; letter-spacing:-.2px; line-height:1.3; }
  .lec-meta{ display:flex; align-items:center; gap:10px; font-size:11.5px; color:var(--hint); }
  .lec-meta .m{ display:inline-flex; align-items:center; gap:4px; }
  .tag-done{ display:inline-flex; align-items:center; gap:4px; color:var(--ok); font-weight:700; }
  .track{ height:5px; border-radius:999px; background:var(--line); margin-top:8px; overflow:hidden; }
  .fill{ height:100%; border-radius:999px; background:var(--btn); transition:width .5s cubic-bezier(.2,.8,.2,1); }
  .lec.done .fill{ background:var(--ok); }
  .lec-chev{ color:var(--hint); flex:0 0 auto; }
  .empty{
    text-align:center; color:var(--hint); padding:46px 20px;
    background:var(--card); border:1px dashed var(--line); border-radius:16px;
  }
  .empty b{ display:block; color:var(--text); margin-bottom:4px; }

  /* ---------- LECTURE VIEW ---------- */
  .l-head{ background:var(--card); border:1px solid var(--line); border-radius:20px; padding:18px; box-shadow:var(--shadow); }
  .l-kicker{ font-size:11px; font-weight:800; letter-spacing:.8px; text-transform:uppercase; color:var(--btn); }
  .l-head h2{ margin:6px 0 10px; font-size:20px; line-height:1.25; letter-spacing:-.3px; }
  .l-chips{ display:flex; flex-wrap:wrap; gap:7px; margin-bottom:12px; }
  .chip{ font-size:11.5px; font-weight:600; color:var(--hint); background:color-mix(in srgb, var(--btn) 9%, transparent); border-radius:999px; padding:5px 10px; display:inline-flex; align-items:center; gap:5px; }
  .l-prog{ margin-top:4px; }
  .l-prog .row{ display:flex; justify-content:space-between; font-size:11.5px; color:var(--hint); margin-bottom:5px; }
  .block{ background:var(--card); border:1px solid var(--line); border-radius:18px; padding:16px 18px; margin-top:14px; box-shadow:var(--shadow); }
  .btag{ display:flex; align-items:center; gap:9px; font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.7px; color:var(--btn); margin-bottom:10px; }
  .btag.green{ color:var(--ok); }
  .btag svg{ flex:0 0 auto; }
  .block p{ margin:0 0 10px; }
  .block p:last-child{ margin-bottom:0; }
  .block ul, .block ol{ margin:0 0 10px; padding-left:20px; }
  .block li{ margin-bottom:6px; }
  .block li:last-child{ margin-bottom:0; }
  .lead{ font-size:15.5px; }
  .plan-list{ counter-reset:pl; list-style:none; padding:0 !important; margin:0 !important; }
  .plan-list li{
    counter-increment:pl; position:relative; padding:11px 12px 11px 46px; margin-bottom:8px;
    background:color-mix(in srgb, var(--btn) 7%, transparent); border-radius:13px; font-weight:550; font-size:14px;
  }
  .plan-list li::before{
    content:counter(pl); position:absolute; left:12px; top:11px; width:24px; height:24px;
    border-radius:8px; background:var(--btn); color:var(--btn-text);
    display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800;
  }
  .q-sec{ margin-top:14px; scroll-margin-top:76px; }
  .q-sec .q-title{
    display:flex; gap:10px; align-items:flex-start;
    font-size:16px; font-weight:750; letter-spacing:-.2px; margin-bottom:10px; line-height:1.3;
  }
  .q-title .qn{
    flex:0 0 auto; width:28px; height:28px; border-radius:9px; margin-top:1px;
    background:var(--btn); color:var(--btn-text); display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:800;
  }
  .q-body p:first-child{ margin-top:0; }
  /* glossary accordion */
  .g-item{ border:1px solid var(--line); border-radius:13px; margin-bottom:8px; overflow:hidden; background:color-mix(in srgb, var(--btn) 4%, transparent); }
  .g-head{
    width:100%; border:none; background:none; cursor:pointer; font-family:inherit;
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:12px 14px; color:var(--text); font-size:14px; font-weight:650; text-align:left;
  }
  .g-head svg{ color:var(--hint); transition:transform .3s ease; flex:0 0 auto; }
  .g-item.open .g-head svg{ transform:rotate(180deg); }
  .g-body{ display:grid; grid-template-rows:0fr; transition:grid-template-rows .32s cubic-bezier(.2,.8,.2,1); }
  .g-item.open .g-body{ grid-template-rows:1fr; }
  .g-inner{ overflow:hidden; }
  .g-inner p{ margin:0; padding:0 14px 13px; font-size:13.5px; color:color-mix(in srgb, var(--text) 82%, transparent); }
  /* quiz */
  .quiz{ counter-reset:qz; list-style:none; padding:0 !important; margin:0 !important; }
  .quiz li{
    counter-increment:qz; position:relative; padding:12px 12px 12px 46px; margin-bottom:8px;
    border:1px dashed color-mix(in srgb, var(--btn) 45%, transparent); border-radius:13px; font-size:14px;
  }
  .quiz li::before{
    content:counter(qz); position:absolute; left:12px; top:12px; width:24px; height:24px; border-radius:50%;
    border:2px solid var(--btn); color:var(--btn); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:800;
  }
  .conclusion{ border-left:4px solid var(--ok); }

  /* ---------- FOOTER NAV ---------- */
  .fnav{
    position:sticky; bottom:0; z-index:40; margin-top:18px;
    display:flex; gap:10px; align-items:center;
    padding:12px; padding-bottom:calc(12px + var(--sab));
    background:color-mix(in srgb, var(--bg) 82%, transparent);
    backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    border-top:1px solid var(--line); border-radius:20px 20px 0 0;
  }
  .fbtn{
    border:none; cursor:pointer; font-family:inherit;
    display:flex; align-items:center; justify-content:center; gap:6px;
    height:46px; border-radius:14px; font-size:13.5px; font-weight:700;
  }
  .fbtn.side{ flex:0 0 52px; background:var(--card); color:var(--btn); border:1px solid var(--line); }
  .fbtn.side:disabled{ opacity:.35; }
  .fbtn.main{ flex:1; background:var(--btn); color:var(--btn-text); box-shadow:var(--shadow); }
  .fbtn.main.isdone{ background:var(--ok); }
  .fbtn:active{ transform:scale(.97); }

  /* ---------- TOAST ---------- */
  #toast{
    position:fixed; left:50%; bottom:calc(84px + var(--sab)); transform:translate(-50%, 20px);
    background:var(--text); color:var(--bg); font-size:13px; font-weight:600;
    padding:10px 16px; border-radius:999px; opacity:0; pointer-events:none;
    transition:all .3s cubic-bezier(.2,.8,.2,1); z-index:99; box-shadow:var(--shadow);
    display:flex; align-items:center; gap:8px; white-space:nowrap;
  }
  #toast.show{ opacity:1; transform:translate(-50%, 0); }
</style>
</head>
<body>
<div id="app">
  <div class="topbar"><div class="topbar-in" id="topbar"></div></div>
  <main id="main"></main>
</div>
<div id="toast"></div>

<script>
"use strict";

/* ============================================================
   ДАННЫЕ КУРСА — 15 лекций по дисциплине «Архивоведение»
============================================================ */
const LECTURES = [
  {
    id:1, hours:2,
    title:"Предмет, цель и задачи архивоведения",
    intro:"Лекция открывает курс и раскрывает архивоведение как самостоятельную научную дисциплину. Рассматриваются её предмет и объект, цель и ключевые задачи, формируется базовый понятийный аппарат, на котором строится вся дальнейшая система знаний, а также характеризуется нормативно-правовая основа архивного дела в Республике Узбекистан.",
    plan:[
      "Архивоведение как наука: объект и предмет исследования",
      "Цель и задачи архивоведения, связь со смежными дисциплинами",
      "Основные категории: документ, архив, архивный фонд, Национальный архивный фонд Республики Узбекистан",
      "Методология и методы архивоведных исследований"
    ],
    sections:[
      { h:"Архивоведение как наука: объект и предмет исследования", html:`
        <p>Архивоведение — это наука, изучающая историю и современное состояние архивного дела, разрабатывающая теорию, методологию и практику комплектования, учёта, хранения и использования архивных документов. Объектом архивоведения выступает архивное дело как общественное явление — вся совокупность деятельности по сохранению документальной памяти, а предметом — закономерности формирования, организации и использования архивных документов и фондов.</p>
        <p>В широком смысле архивоведение включает несколько направлений: теорию архивного дела (архивоведение в узком смысле), историю архивов и архивного дела, источниковедение архивных документов, археографию и организацию архивного дела. Термин «архивоведение» закрепился в отечественной науке в 1920–1930-е годы и стал обозначать целостный комплекс знаний об архивах и работе с ними.</p>
        <p>В Республике Узбекистан архивоведение преподаётся как фундаментальная дисциплина в системе исторического образования. Его становление связано с научной школой узбекских архивистов, исследовавших уникальное документальное наследие Мавераннахра, Туркестанского края и Узбекской ССР.</p>` },
      { h:"Цель и задачи архивоведения, связь со смежными дисциплинами", html:`
        <p>Цель архивоведения — научное обоснование организации сохранения документального наследия народа и обеспечение его эффективного использования в интересах науки, государства и общества.</p>
        <p>Основные задачи дисциплины:</p>
        <ul>
          <li>разработка теории комплектования Национального архивного фонда и принципов отбора документов;</li>
          <li>научное обоснование экспертизы ценности документов;</li>
          <li>совершенствование научно-справочного аппарата (НСА) к документам;</li>
          <li>разработка режимов и методов обеспечения физической сохранности документов;</li>
          <li>научная организация использования архивных документов, включая их публикацию;</li>
          <li>совершенствование нормативно-правовой и организационной базы архивного дела.</li>
        </ul>
        <p>Архивоведение тесно связано со смежными науками: с историей и источниковедением (архивный документ — важнейший исторический источник), документоведением (общие закономерности создания и функционирования документов), дипломатикой (изучение формуляра актов), археографией (публикация документов), информатикой (автоматизация архивных процессов) и юриспруденцией. Правовую основу отрасли в Узбекистане составляет Закон Республики Узбекистан «Об архивном деле» от 15 апреля 1999 года, определяющий правовые отношения в сфере формирования, сохранения и использования Национального архивного фонда.</p>` },
      { h:"Основные категории: документ, архив, архивный фонд, Национальный архивный фонд", html:`
        <p>Документ — материальный носитель с зафиксированной на нём информацией, имеющий реквизиты, позволяющие её идентифицировать. Архивный документ — это документ, сохраняемый или подлежащий сохранению ввиду его значения для общества и государства, его ценности для науки, истории и культуры.</p>
        <p>Архив — учреждение или структурное подразделение организации, осуществляющие приём, хранение, учёт и использование архивных документов; в собирательном смысле — само собрание документов, образовавшееся в процессе деятельности учреждений и лиц.</p>
        <p>Архивный фонд — исторически сложившаяся совокупность архивных документов, объединённых отношением к одному фондообразователю. Фондообразователь — организация, учреждение, предприятие или лицо, в результате деятельности которых образовался архивный фонд. Национальный архивный фонд Республики Узбекистан (НАФ) — совокупность архивных документов независимо от времени их создания, вида и формы, от которых зависит сохранение и воспроизводство истории материальной и духовной жизни народа Узбекистана; НАФ находится под охраной государства и подлежит учёту в установленном законодательством порядке.</p>` },
      { h:"Методология и методы архивоведных исследований", html:`
        <p>Методологическая основа архивоведения опирается на принципы историзма, научности и системности: каждый документ и фонд рассматривается в конкретно-исторических условиях его создания, в связи с деятельностью фондообразователя и эпохой.</p>
        <p>В архивоведных исследованиях применяются общенаучные и специальные методы:</p>
        <ul>
          <li>историко-генетический — изучение происхождения и развития фонда;</li>
          <li>логический — выявление внутренних связей между документами;</li>
          <li>системно-структурный — анализ фонда как целостной системы;</li>
          <li>статистический — обработка массовых однородных документов;</li>
          <li>сравнительно-исторический и метод критики источников.</li>
        </ul>
        <p>Практическая методология архивной работы закреплена в нормативных актах: правилах комплектования, инструкциях по учёту и хранению, положениях, утверждаемых уполномоченным органом в сфере архивного дела — Архивным агентством «Узархив».</p>` }
    ],
    glossary:[
      ["Архивоведение","Наука, изучающая историю, теорию, организацию и практику архивного дела, а также разрабатывающая вопросы сохранения и использования архивных документов."],

    sections:[
      { h:"Понятие и значение классификации архивных документов", html:`
        <p>Классификация архивных документов — научно обоснованное распределение документов на группы (классы) на основе общих существенных признаков. Это не механическая сортировка, а логическая операция, отражающая реальные связи между документами и историю их образования.</p>
        <p>Значение классификации многопланово: она лежит в основе комплектования архивов (определения источников поступления), систематизации фондов, построения научно-справочного аппарата, организации хранения и статистического учёта. Без строгой классификации невозможен государственный учёт Национального архивного фонда, предусмотренный Законом Республики Узбекистан «Об архивном деле» (1999 г.).</p>
        <p>В практике архивов Узбекистана классификационные схемы и перечни утверждаются уполномоченным органом в сфере архивного дела — Архивным агентством «Узархив», что обеспечивает единство подходов во всех государственных архивах республики.</p>` },
      { h:"Основные основания классификации документов НАФ", html:`
        <p>Документы НАФ классифицируются по нескольким независимым основаниям, каждое из которых раскрывает свою сторону документа:</p>
        <ul>
          <li>по материалу и виду носителя — бумажные, кинофотодокументы, фонодокументы, видеодокументы, электронные документы;</li>
          <li>по способу фиксации информации — письменные (рукописные и печатные), графические (чертежи, карты), аудиовизуальные, машиночитаемые;</li>
          <li>по содержанию и назначению — документация по управлению, научно-техническая документация, документы по личному составу;</li>
          <li>по хронологическому принципу — документы дореволюционного периода (до 1917 г.), советского периода (1917–1991 гг.), периода независимости (с 1991 г.);</li>
          <li>по полноте сохранности — полные и неполные фонды, личные собрания и коллекции;</li>
          <li>по степени ценности — документы постоянного (бессрочного) и временного хранения.</li>
        </ul>
        <p>Хронологическое деление имеет для НАФ Узбекистана особое значение: оно соотносится с крупнейшими рубежами национальной истории — присоединением края к России, советской властью, провозглашением независимости 31 августа 1991 года.</p>` },
      { h:"Уровни организации архивного фонда: фонд — опись — дело — документ", html:`
        <p>Национальный архивный фонд структурируется иерархически. Высший уровень — архивный фонд: совокупность документов одного фондообразователя (министерства, учреждения, предприятия, семьи, выдающегося деятеля). Каждому фонду присваивается учётный номер, сохраняющийся постоянно.</p>
        <p>Фонд делится на описи (в крупных фондах — на части фонда по структурным подразделениям или хронологии). Опись содержит дела (единицы хранения): сгруппированные по признаку связности документы — личное дело, переписка за год, протоколы заседаний и т.п. Наконец, дело состоит из отдельных документов (листов).</p>
        <p>Таким образом, полный архивный шифр (ссылка) документа включает номер фонда, номер описи, номер дела и номер листа. Например: «ЦГА РУз, ф. Р-1, оп. 1, д. 25, л. 12». Единица хранения — учётная единица архива: дело на бумажной основе, фотонегатив, киноплёнка, аудионоситель, электронный файл с метаданными.</p>
        <p>Строгое соблюдение иерархии обеспечивает незыблемость фондового принципа — главного организационного принципа советской и узбекской архивной школы: документы хранятся и описываются внутри фонда, отражая деятельность фондообразователя.</p>` },
      { h:"Классификация НАФ по правовому статусу и происхождению документов", html:`
        <p>По Закону РУз «Об архивном деле» Национальный архивный фонд делится на государственную и негосударственную части. Государственная часть образуется документами органов государственной власти и управления, государственных предприятий, учреждений и организаций; она является государственной собственностью и неотчуждаема.</p>
        <p>Негосударственную часть составляют документы общественных объединений, религиозных организаций, негосударственных предприятий и частных лиц. Эти документы могут находиться в частной собственности, однако подлежат государственному учёту; их владельцы обязаны соблюдать установленные правила хранения и предоставлять сведения о них государственным архивам.</p>
        <p>Особую категорию образуют фонды личного происхождения — архивы выдающихся деятелей государства, науки, литературы и искусства, а также семейные и родовые архивы. Их специфика: многообразие видов документов (переписка, дневники, рукописи, фотографии, наградные документы) и особый порядок поступления — по договорам купли-продажи, дарения, на депозитное (временное без перехода права собственности) хранение.</p>` }
    ],

    sections:[
      { h:"Документация по управлению (управленческая документация)", html:`
        <p>Документация по управлению образуется в делопроизводстве органов власти и управления, организаций и предприятий. Это самый массовый и исторически наиболее полный раздел НАФ. К ней относятся:</p>

      { h:"Научно-техническая документация: виды и особенности хранения", html:`
        <p>Научно-техническая документация (НТД) фиксирует результаты научной, конструкторской, проектной и производственной деятельности. Выделяются научно-исследовательская документация (отчёты о НИР, диссертационные материалы), проектная (проекты зданий и сооружений), конструкторская (чертежи изделий), технологическая (технологические карты, регламенты) и патентная документация.</p>
        <p>Для Узбекистана особую значимость имеют проектные документы на объекты ирригации, промышленности, градостроительства — от каналов Ферганской долины до генеральных планов Ташкента и новых городов советского периода. НТД хранится в специализированных архивах с учётом форматов: чертежи и карты — в планшетах (плоско), трассировки — вертикально, с обязательным указанием индекса единицы хранения.</p>

      { h:"Кино-, фото-, фоно- и видеодокументы в составе НАФ", html:`
        <p>Аудиовизуальные документы — самостоятельный раздел НАФ, требующий особого режима. Фотодокументы (негативы и позитивы, слайды, цифровые изображения) фиксируют историческую реальность с наглядностью, недоступной тексту. Фотособрания Туркестана конца XIX века — уникальный источник по этнографии и архитектуре края.</p>
        <p>Фонодокументы (грампластинки, магнитные ленты, цифровой звук) сохранили голоса выдающихся деятелей, музыкальный фольклор, художественное чтение. Кинодокументы (документальные и хроникальные фильмы) и видеодокументы охватывают историю республики с 1920-х годов до событий независимости.</p>
        <p>Концентрацией и хранением аудиовизуальных документов в Узбекистане занимается специализированный государственный архив кино-, фото- и фонодокументов. Режим хранения строже бумажного: пониженная температура (для плёнок — от +2 до +12 °C), влажность 30–40 %, защита магнитных носителей от электромагнитных полей, периодическая проверка и перемотка лент.</p>` },
      { h:"Электронные документы и документы личного происхождения", html:`
        <p>Электронные документы — документы на машиночитаемых носителях, требующие для воспроизведения программно-технических средств. Правовую базу их обращения составляют Законы РУз «Об электронной подписи», «Об электронном документообороте», «Об электронном правительстве». Электронный документ, удостоверенный электронной цифровой подписью, имеет юридическую силу наравне с бумажным.</p>
        <p>Архивные проблемы электронных документов: быстрое устаревание носителей и форматов, зависимость от программного обеспечения, необходимость миграции (перезаписи в актуальные форматы) и фиксации метаданных (автор, дата создания, версии). Государственные архивы формируют электронные копии-оригиналы и развивают системы долговременного цифрового хранения.</p>
        <p>Документы личного происхождения (переписка, дневники, мемуары, личные фото, наградные книги) пополняют НАФ через договоры с владельцами. Они бесценны для воссоздания биографий деятелей узбекской культуры, науки и государственности, придают НАФ «человеческое измерение», дополняя официальную документацию частной жизнью эпохи.</p>` }

          <li>установлена обязанность организаций обеспечивать сохранность документов и передавать их на государственное хранение по истечении ведомственных сроков;</li>
          <li>закреплены права граждан на доступ к архивным документам и порядок их использования;</li>

        <p>В развитие Закона Кабинетом Министров и органом управления архивным делом утверждались положения и правила: о комплектовании государственных архивов, о порядке хранения, использования и учёта документов НАФ, типовые перечни документов со сроками хранения.</p>` },
      { h:"Понятие, состав и государственный учёт Национального архивного фонда", html:`
        <p>Национальный архивный фонд (НАФ) — совокупность архивных документов независимо от времени их создания, вида, формы и места хранения, от которых зависит сохранение истории материальной и духовной жизни народа Узбекистана. НАФ — не только хранимое в архивах прошлое, но и документы, которые ещё только будут отобраны на государственное хранение.</p>
        <p>По происхождению в НАФ выделяются: документы исторических учреждений (ханств, Туркестанского генерал-губернаторства, советских органов); документы органов власти независимого Узбекистана (Олий Мажлиса, Президента, Кабинета Министров, министерств, судов, хокимиятов); документы общественных объединений и религиозных конфессий; фонды личного происхождения; аудиовизуальные и электронные документы.</p>
        <p>Государственный учёт НАФ — система регистрации документного состава: первичный учёт (при поступлении), фондовый учёт (книги учёта фондов и единиц хранения), учёт движения документов (выдача во временное пользование). Учётные сведения регулярно обобщаются и согласовываются с уполномоченным органом, что обеспечивает контроль полноты и сохранности национального документального достояния.</p>` },
      { h:"Система архивных учреждений республики в 1990–2010-е годы", html:`
        <p>В первые десятилетия независимости управление архивным делом осуществляло Главное архивное управление при Кабинете Министров Республики Узбекистан (Главархив). Оно разрабатывало нормативную базу, координировало деятельность подведомственных архивов, вело государственный учёт НАФ.</p>
        <p>Система хранения включала центральные государственные архивы: Центральный государственный архив РУз (концентрирующий документы органов власти и исторические фонды), государственный архив кино-, фото- и фонодокументов, архив научно-технической документации, а также территориальные архивы: государственные архивы Республики Каракалпакстан, областей и города Ташкента с подчинёнными городскими и районными архивами.</p>
        <p>Параллельно действовала сеть ведомственных архивов министерств и ведомств, хранящих документы до истечения сроков ведомственного хранения, и архивные подразделения организаций. Подготовка кадров велась в системе высшего образования (исторические факультеты вузов) и через курсы повышения квалификации архивистов.</p>` }

      { h:"Понятие, задачи и принципы экспертизы ценности документов", html:`

        <p>Задачи экспертизы: отбор документов, подлежащих передаче в государственные архивы, — тем самым экспертиза является научным инструментом комплектования НАФ; установление сроков хранения всех документов организации; выявление неполноты и недостатков формирования фондов; выбраковка документов, утративших значение, с соблюдением строгой процедуры.</p>
        <p>Принципы экспертизы: комплексность (документ оценивается по совокупности признаков), историзм (учёт значимости для будущих поколений, а не только текущей пользы), объективность и недопустимость субъективного подхода — законодательство прямо запрещает уничтожать документы по мотивам политической или иной конъюнктурной «неудобности».</p>` },

      { h:"Этапы проведения экспертизы и оформление её результатов", html:`
        <p>Технология экспертизы в организации включает последовательные этапы. Первый — организационный: создание ЭК, изучение ретроспективы документооборота, составление справки об организации. Второй — аналитический: группировка дел по номенклатуре, подробный просмотр содержания, предварительная оценка.</p>
        <p>Третий этап — оформление результатов: на документы постоянного и длительного хранения составляются описи; на временные документы с истёкшим сроком — акты о выделении к уничтожению. Описи дел постоянного хранения являются главным результатом экспертизы: они утверждаются руководством организации по согласованию с государственным архивом (ЦЭК/ЭПК) и становятся основанием будущей передачи фонда.</p>
        <p>Отдельные категории документов имеют особые сроки: документы по личному составу хранятся длительные сроки (как правило, 75 лет) в интересах социальной защиты граждан; уставные документы, годовые отчёты, протоколы коллегий — постоянно. Результаты экспертизы подлежат пересмотру при изменении структуры организации или выходе новых перечней.</p>` }

  {
    id:9, hours:2,
    title:"Экспертиза ценности документов. Приём документов в государственные архивы. Часть 2",
    intro:"Вторая часть темы посвящена практическому завершению экспертизы — приёму документов в государственные архивы. Рассматриваются источники и принципы комплектования, порядок подготовки и передачи дел из организаций, оформление актов приёма-передачи, а также судьба документов временного хранения: ведомственное хранение и процедура выбраковки.",
    plan:[

    sections:[
      { h:"Источники и принципы комплектования государственных архивов", html:`
        <p>Источники комплектования — организации, учреждения, предприятия и физические лица, документы которых подлежат передаче в конкретный государственный архив. Круг источников закрепляется за каждым архивом распорядительным актом уполномоченного органа с учётом территориального и ведомственного принципов: центральные архивы принимают документы органов республиканского уровня, территориальные — областного, городского, районного.</p>
        <p>Принципы комплектования: плановость (передача по утверждённым планам и графикам); систематичность (регулярные поступления, а не разовые акции); полнота и качество (приём документов, прошедших экспертизу и оформленных по стандартам); сочетание государственной обязательности передачи с уважением прав частных владельцев (договорный порядок для негосударственной части НАФ).</p>
        <p>Закон РУз «Об архивном деле» обязывает все организации обеспечивать сохранность документов и своевременную передачу документов постоянного хранения в государственные архивы по истечении ведомственных сроков.</p>` },
      { h:"Подготовка и передача документов организаций на государственное хранение", html:`
        <p>Путь документа в государственный архив начинается в делопроизводстве. Дела формируются по номенклатуре дел (систематизированному перечню заголовков), завершаются, проходят экспертизу ценности. На дела постоянного и длительного хранения составляются описи, согласуемые с государственным архивом и утверждаемые в установленном порядке.</p>
        <p>Техническая подготовка дел к сдаче: подшивка или переплетение, нумерация листов (карандашом, в правом верхнем углу), оформление заголовка обложки (наименование организации, индекс дела, заголовок по описи, дата, количество листов), составление листа-заверителя дела с подписью должностного лица. Документы в неудовлетворительном физическом состоянии реставрируются или копируются.</p>
        <p>Передача осуществляется по графику, согласованному с архивом. Документы постоянного хранения передаются по истечении установленных в правилах сроков ведомственного хранения (как правило, через несколько лет после завершения дел), документы по личному составу — по истечении более длительных сроков. При ликвидации или реорганизации организации документы постоянного хранения немедленно передаются в государственный архив правопреемником или ликвидационной комиссией — это важная гарантия от утраты фондов.</p>` },
      { h:"Оформление приёма: акты приёма-передачи и учёт поступлений", html:`
        <p>Передача документов оформляется актом приёма-передачи — юридическим документом, фиксирующим момент смены места хранения и ответственности. В акте указываются: наименование сдающей и принимающей сторон, наименование и номер фонда, перечень описей, количество единиц хранения по каждой описи, хронологические рамки документов, техническое состояние дел, особые отметки (неполнота, наличие копий).</p>
        <p>Акт подписывается руководителями организации и архива, утверждается в установленном порядке. На его основании архив проводит учётные действия: запись в книге учёта поступлений (первичный учёт), закрепление за фондом номера (или регистрация нового фонда), внесение изменений в учётные документы источника.</p>
        <p>Акт приёма-передачи имеет постоянное значение: он становится частью документации фондового дела архива и служит юридическим основанием права архива на хранение и использование переданных документов, а также инструментом контроля при инспекциях.</p>` },
      { h:"Ведомственное хранение и выбраковка документов с истёкшими сроками", html:`
        <p>Документы длительного хранения (свыше 10 лет), не входящие в постоянную часть фонда, хранятся в ведомственных архивах организаций. Наиболее массовая категория — документы по личному составу (приказы, личные дела, документы о заработной плате), которые десятилетиями служат для подтверждения трудовых и пенсионных прав граждан.</p>
        <p>Документы временного хранения (до 10 лет) по истечении срока подлежат выбраковке — отбору к уничтожению. Процедура строго регламентирована: экспертная комиссия организации проводит контрольный просмотр, составляет акт о выделении документов к уничтожению; акт передаётся на рассмотрение ЭПК государственного архива; только после визы ЭПК и утверждения документы могут быть уничтожены способом, исключающим восстановление (сжигание, переработка в макулатуру — для документов без ограничений), комиссионно, с составлением итогового акта.</p>
        <p>Добровольное (внекомиссионное) уничтожение любых документов организаций запрещено законодательством и влечёт ответственность. Эта норма — важнейшая гарантия неприкосновенности Национального архивного фонда и защиты будущей исторической науки от случайных или преднамеренных утрат.</p>` }

  {
    id:10, hours:2,
    title:"Организация научно-справочного аппарата к документам НАФ РУз. Часть 1",
    intro:"Лекция посвящена научно-справочному аппарату (НСА) — системе архивных справочников, без которых невозможен поиск в миллионах единиц хранения. Рассматриваются понятие и состав НСА, внутрифондовые справочные средства (описи как основа НСА), картотечные справочники архивов и требования к их составлению в архивах Республики Узбекистан.",

    sections:[
      { h:"Понятие, значение и структура научно-справочного аппарата", html:`
        <p>Научно-справочный аппарат (НСА) архива — комплекс взаимосвязанных и взаимодополняющих архивных справочников на традиционных и электронных носителях, раскрывающих состав и содержание документов, находящихся на хранении. НСА — это «ключи к архиву»: без него фонд из тысяч дел становится информационно недоступным.</p>
        <p>Функции НСА двуедины: внутренняя (обеспечение контроля за сохранностью, учёта, оперативного поиска для самих сотрудников) и внешняя (информационное обеспечение пользователей — исследователей, граждан, организаций). Качество НСА определяет эффективность всей использовательской работы архива.</p>
        <p>В структуре НСА выделяются: внутрифондовые справочники (описи, каталоги дел); общеархивные картотеки (систематический и алфавитный каталоги, картотеки указателей); сводные справочники (путеводители, обзоры, сводные каталоги); электронные ресурсы (базы описаний, полнотекстовые хранилища цифровых копий). Они образуют многоуровневую систему: от справочника к конкретному делу — к обобщающим справочникам о фондах архива в целом.</p>` },
      { h:"Опись как основа НСА: виды и элементы описания", html:`
        <p>Опись — архивный справочник, содержащий систематизированный перечень единиц хранения фонда или его части, с раскрытием их содержания. Опись одновременно выполняет и учётную функцию: наличие дела в описи — основное свидетельство его постановки на архивное хранение.</p>
        <p>Элементы описания единицы хранения в описи: порядковый номер дела; индекс дела (шифр по номенклатуре/классификационной схеме); заголовок дела, точно воспроизводящий или научно уточняющий подлинный заголовок (вид дела, автор/корреспондент, название вопроса, хронологические рамки); дата (крайние даты) дела; количество листов; примечание (особенности физического состояния, наличие копий, дело на контроле и др.).</p>
        <p>Виды описей: опись дел постоянного хранения; опись дел по личному составу; опись дел длительного хранения. К архивному опису предъявляются требования научного оформления: титульный лист, предисловие (историческая справка о фондообразователе и характеристике фонда), оглавление, сам опиcный перечень, указатели, лист-свидетель. Качественное предисловие к описи — научное исследование истории фонда.</p>` },

        <p>Систематический каталог — главный научный справочник архива: карточки расположены по схемам тематической классификации (например: государственное строительство — экономика — социальная сфера — культура — личные фонды), раскрывая содержание фондов по вопросам. Исследователь, изучающий ирригационную политику Туркестана, получает через систематический каталог сведения о делах десятков фондов сразу.</p>
        <p>Алфавитная картотека (алфавитный каталог) содержит карточки на наименования лиц, учреждений, предприятий, географических пунктов в алфавитном порядке — оперативный инструмент справочной работы. Хронологические картотеки (на события, даты), картотеки публикаций документов и другие служебные картотеки дополняют систему. Дублирование карточек между каталогами обеспечивает множественность путей поиска.</p>` },
      { h:"Общие требования к составлению архивных справочников", html:`
        <p>Все справочники НСА архивов Узбекистана составляются по единым методическим правилам, утверждаемым Агентством «Узархив», что обеспечивает сопоставимость справочных систем разных архивов. Основные требования:</p>

          <li>научная обоснованность систематизации — рубрикация, отражающая реальное содержание документов и логику их возникновения;</li>
          <li>единая терминология — последовательное употребление названий учреждений, должностей, географических имён с указанием исторических вариантов наименований;</li>
          <li>актуализация — своевременное внесение сведений о новых поступлениях, изменениях в учёте, выдачах и перемещениях дел.</li>
        </ul>
        <p>Соблюдение этих требований делает НСА надёжной «навигационной системой» архива и подготавливает данные для перевода в электронные каталоги.</p>` }
    ],

      { h:"Система органов управления архивным делом Республики Узбекистан", html:`
        <p>Управление архивной отраслью строится по вертикали. Верхний уровень — Кабинет Министров Республики Узбекистан, определяющий государственную политику в архивной сфере. Отраслевой уровень — специально уполномоченный орган, Архивное агентство «Узархив», реализующее единую политику, разрабатывающее нормативную базу и осуществляющее контрольно-методические функции.</p>
        <p>Полномочия Агентства: утверждение правил комплектования, хранения, учёта и использования документов; утверждение типовых перечней со сроками хранения; определение круга источников комплектования архивов; ведение сводного государственного учёта НАФ; инспектирование сохранности документов в организациях и архивах; координация международного сотрудничества.</p>
        <p>Нижние уровни — территориальные управления архивного дела (Республика Каракалпакстан, области, города) с подчинёнными государственными архивами, а также руководители министерств и ведомств, отвечающие за ведомственные архивы и документооборот. Такая многоуровневая система сочетает централизацию методологии с учётом региональных особенностей документального наследия.</p>` },
      { h:"Типология архивных учреждений и их функции", html:`
        <p>В Республике Узбекистан действует несколько типов архивных учреждений. Центральные государственные архивы общего профиля (Центральный государственный архив РУз) концентрируют документы высших органов власти и комплексы исторических фондов общегосударственного значения. Специализированные центральные архивы хранят документы по виду носителя (архив кино-, фото- и фонодокументов) или содержанию (архив научно-технической документации).</p>
        <p>Территориальные государственные архивы (республиканский в Каракалпакстане, областные, город Ташкента и подчинённые им городские/районные архивы) отвечают за документы регионального уровня: хокимиятов, региональных управлений, предприятий, личные фонды края. Муниципальные и ведомственные архивы обеспечивают временное хранение до передачи в государственные.</p>
        <p>Особый тип — архивные подразделения организаций (архивы канцелярий, отделы документационного обеспечения) и частные архивы (архивы политических партий, общественных объединений, фондов, религиозных организаций, частных лиц). Частные архивы регистрируются, хозяева обязуются соблюдать правила сохранности документов негосударственной части НАФ.</p>` },
      { h:"Функциональная структура государственного архива", html:`
        <p>Государственный архив строится по функциональному принципу: каждое подразделение отвечает за один из ключевых процессов «жизни документа» в архиве.</p>
        <ul>
          <li>отдел комплектования — взаимодействие с источниками, приём и предварительная обработка фондов;</li>
          <li>отдел хранения и учёта — размещение, микроклимат, учётные книги, учёт движения дел;</li>
          <li>отдел научно-справочного аппарата — систематизация фондов, составление описей, каталогов, путеводителей;</li>
          <li>отдел использования и информационного обслуживания (читальный зал) — работа с пользователями, исполнение запросов, выдача справок;</li>
          <li>реставрационная (стабилизационная) мастерская — обеспечение физической сохранности, дезинфекция, реставрация;</li>
          <li>лаборатория микрофильмирования и цифровизации — создание страховых и пользовательских копий;</li>
          <li>административно-хозяйственная служба, бухгалтерия.</li>
        </ul>
        <p>Межфункциональные звенья — экспертно-проверочная комиссия, редакционно-издательская группа, проектные группы по цифровизации — создаются для решения сквозных задач. Структура закрепляется положением об архиве и штатным расписанием.</p>` },
      { h:"Управленческая документация, кадры и научно-методическое обеспечение", html:`
        <p>Управление архивом документируется: положение об архиве (миссия, функции, структура), годовые и перспективные планы, регламенты процессов, учётно-отчётная документация (книги учёта поступлений и выдач, годовые отчёты о составе фондов), журналы контроля микроклимата и проверок наличия. Планово-аналитический цикл (план — исполнение — отчёт — анализ) обеспечивает управляемость учреждения.</p>
        <p>Кадровое обеспечение: профильное образование архивистов на исторических факультетах вузов республики; непрерывное повышение квалификации — курсы, стажировки, семинары по новым нормативам и цифровым технологиям; формирование специализаций — реставратор, специалист НСА, инженер-хранитель, специалист по цифровизации.</p>
        <p>Научно-методическое обеспечение — системообразующая функция отрасли: издание правил, инструкций, методических рекомендаций Агентством «Узархив»; научные исследования по проблемам архивоведения; профессиональные издания, конференции архивистов; взаимодействие с научными учреждениями Академии наук и вузами в разработке методологии национального архивостроения.</p>` }
    ],
    glossary:[
      ["Уполномоченный орган","Государственный орган, наделённый полномочиями управлять архивным делом страны (Агентство «Узархив»)."],
      ["Центральный государственный архив","Архив, хранящий фонды общегосударственного значения и документы высших органов власти."],

    outro:"Управление архивными учреждениями — это сочетание публичной власти (нормотворчество, контроль, учёт) и учрежденческого менеджмента (структура, кадры, планирование). Выстроенная в Республике Узбекистан многоуровневая система с сильным методическим центром обеспечивает единство архивной политики и преемственность работы всех звеньев национального архивостроения.",

  {
    id:14, hours:2,
    title:"Хранение архивных документов",
    intro:"Лекция раскрывает фундамент архивной практики — обеспечение физической сохранности документов. Рассматриваются виды хранения, нормы микроклимата и санитарно-гигиенического режима архивохранилищ, система учёта единиц хранения и формирование страхового фонда, а также реставрация, стабилизация и цифровое страхование документального наследия.",
    plan:[
      "Виды хранения и задачи обеспечения сохранности документов",
      "Режим хранения: микроклимат, освещение, санитарно-гигиенический контроль",
      "Учёт единиц хранения и организация страхового фонда",
      "Реставрация, стабилизация и цифровое обеспечение сохранности"
    ],
    sections:[
      { h:"Виды хранения и задачи обеспечения сохранности документов", html:`
        <p>Хранение архивных документов — создание условий, обеспечивающих их физическую сохранность, недопущение утрат и доступность для использования. По срокам выделяются постоянное (бессрочное) хранение документов — ядро Национального архивного фонда — и временное хранение (до 10 лет и свыше 10 лет в организациях).</p>
        <p>По способу размещения — стеллажное (дела в коробах на стеллажах, основной способ), шкафное, планшетное (крупноформатные листы: чертежи, карты), навесное, контейнерное (аудиовизуальные носители в спецупаковке). Особо ценные документы хранятся в сейфах и спецхранилищах с поштучным учётом.</p>
        <p>Задачи обеспечения сохранности: защита от физико-химических воздействий (свет, температура, влажность), биологических угроз (плесень, грибки, насекомые, грызуны), антропогенных факторов (пожар, кража, халатность) и чрезвычайных ситуаций (стихии, аварии). Сохранность достигается комплексом: здания-архивохранилища, соответствующие проектным нормам, регламентированный микроклимат, учёт, охранные системы, дисциплина персонала.</p>` },
      { h:"Режим хранения: микроклимат, освещение, санитарно-гигиенический контроль", html:`
        <p>Микроклимат — ключевой фактор. Для документов на бумажной основе установлены оптимальные параметры: температура 16±2 °C (допустимый диапазон 14–18 °C), относительная влажность воздуха 50–60 %. Перепады этих показателей разрушают бумагу быстрее времени: сухость делает её ломкой, влага вызывает грибковые поражения и расплыв чернил. Кино- и фотоплёнки требуют более холодного режима (от +2 до +12 °C, влажность 30–40 %), магнитные и цифровые носители — защиты от электромагнитных полей и миграции данных.</p>
        <p>Освещение: естественный свет — враг бумаги. Хранилища проектируются без окон либо с светофильтрами; освещённость на поверхности документа не должна превышать установленных норм (для бумаги — порядка 50 люкс), ультрафиолет исключается специальными покрытиями ламп.</p>
        <p>Санитарно-гигиенический режим: регулярные контрольные замеры температуры и влажности с записями в журналах, периодические (ежемесячные и ежегодные) проверки физического состояния дел, карантинная обработка новых поступлений, дезинфекция и дезинсекция помещений, запрет на внесение пищи и горючих материалов. Пожарная безопасность — автоматическая сигнализация и системы огнетушения, не повреждающие документы (газовые, аэрозольные), инструктаж персонала и планы эвакуации фондов.</p>` },
      { h:"Учёт единиц хранения и организация страхового фонда", html:`
        <p>Сохранность невозможна без точного учёта. Система учёта включает: первичный учёт (книга учёта поступлений — каждое поступление фиксируется по акту); фондовый учёт (книга учёта единиц хранения — сальдо по фондам и описи); учёт выдач (книга учёта выдачи дел во временное пользование с сроками возврата); поштучный учёт особо ценных документов (с описью отличительных признаков и хранением в изолированном помещении).</p>
        <p>Периодическая проверка наличия и состояния документов — ключевая форма контроля: сверка учётных данных с фактическим наличием, оформление актов, выявление недостач и повреждений с последующим расследованием. Результаты проверок отражаются в учётных документах и отчётах, представляемых уполномоченному органу.</p>
        <p>Страховой фонд — совокупность дублирующих копий (микрофильмов, цифровых копий) особо ценных документов, создаваемая для страхования от утрат при чрезвычайных обстоятельствах. Правила страхового фонда: копии хранятся изолированно от оригиналов, в идеале — в другом здании; оригиналы, имеющие страховые копии, к использованию не выдаются; состав фонда периодически пересматривается, копии проверяются на читаемость и подлежат миграции при устаревании носителей.</p>` },
      { h:"Реставрация, стабилизация и цифровое обеспечение сохранности", html:`
        <p>Реставрация — комплекс работ по укреплению и частичному восстановлению физических свойств повреждённых документов. Предшествует ей консервация (остановка разрушения): очистка, дезинфекция, дезактивация (нейтрализация кислотности бумаги — главной причины саморазрушения бумаг XIX–XX веков).</p>
        <p>Методы реставрации: подклейка разрывов реставрационной бумагой, дублерование (наращивание утраченных участков), исторически применявшиеся ламинирование и фолиерование (вклейка листа в рамку из бумажной или тканевой основы) и современные технологии — листовая отливка в бумажной массе, что позволяет бережно восстанавливать лист целиком. Все работы проводятся обученными реставраторами по принципу минимального вмешательства и документируются.</p>
        <p>Стабилизация — система профилактических мер, направленных на предупреждение разрушения: нейтральная упаковка (короба из некислотного картона), контроль микроклимата, регламентированное использование. Современный стратегический резерв — цифровое обеспечение сохранности: создание качественных цифровых копий (форматы без потерь TIFF, JPEG2000 с метаданными), многократное резервное хранение, регулярная проверка целостности и своевременная миграция форматов. Цифровая копия служит и страховкой, и основным рабочим инструментом пользователей, щадящим оригинал.</p>` }
    ],
    glossary:[
      ["Обеспечение сохранности","Комплекс мер по защите архивных документов от разрушения, порчи и утраты."],

    outro:"Хранение — молчаливая, ежедневная и важнейшая работа архива: дисциплина микроклимата, скрупулёзный учёт, страховые копии и искусство реставрации обеспечивают физическое бессмертие документа. Современная архивистика соединяет тысячелетний опыт бережного обращения с носителем и цифровые технологии страхования национальной памяти.",

  {
    id:15, hours:2,
    title:"Археография",

    plan:[

    ],
    sections:[
      { h:"Археография как наука: предмет, задачи, история становления", html:`
        <p>Археография — специальная историческая дисциплина, разрабатывающая теорию, методологию и методику поиска, выбора, подготовки и научной публикации исторических документов. Её задача — превратить архивный подлинник в достоверный научный текст, доступный исследователям без потери документальной точности.</p>
        <p>Термин «археография» введён в русской науке в середине XIX века (Н.В. Калачов). Практическим фундаментом дисциплины стала Археографическая комиссия в России (с 1834 года), издавшая фундаментальные актовые своды. Классическая археография выработала идеал публикации: точнейшая передача текста, полнота научно-справочного аппарата, непредвзятость отбора.</p>
        <p>Современная археография тесно связана с источниковедением (установление достоверности документа), дипломатикой (анализ формуляра), палеографией (чтение древних почерков) и текстологией (критика текста). Публикация документа — итог междисциплинарного научного исследования, а не механическая перепечатка.</p>` },
      { h:"Виды и типы публикаций архивных документов", html:`

============================================================ */
const LS_KEY = "arxiv_course_v1";
let store = { p:{} };
try { const d = JSON.parse(localStorage.getItem(LS_KEY)); if(d && d.p) store = d; } catch(e){}
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(store)); }catch(e){} }
function getP(id){ return store.p[id] || { sp:0, done:false }; }
function shownP(id){ const r = getP(id); return r.done ? 100 : Math.round(r.sp||0); }
function totalAvg(){ let s=0; LECTURES.forEach(l=> s+=shownP(l.id)); return Math.round(s/LECTURES.length); }
function doneCount(){ return LECTURES.filter(l=>getP(l.id).done).length; }

    l.glossary.map(g=>g[0]+" "+g[1]).join(" ")).toLowerCase();
});

function renderTopbar(){

function ringSVG(pct){
  const r=32, c=2*Math.PI*r, off=c*(1-pct/100);
  return '<svg class="ring" width="76" height="76" viewBox="0 0 76 76">'+
    '<circle class="trk" cx="38" cy="38" r="'+r+'"/>'+
    '<circle class="prg" cx="38" cy="38" r="'+r+'" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'"/>'+
    '<text x="38" y="42" text-anchor="middle" font-size="16">'+pct+'%</text></svg>';
}

function scrollToSec(i){
  const el = document.getElementById("qsec-"+i);
  if(el) el.scrollIntoView({behavior:"smooth", block:"start"});
  haptic("light");
}
function toggleGloss(i){
  document.getElementById("g-"+i).classList.toggle("open");
  haptic("light");
}
function toggleDone(){
  if(current===null) return;
  const r = getP(current);
  r.done = !r.done;
  if(r.done) r.sp = 100; else if(r.sp>=100) r.sp = 99;
  store.p[current] = r; save();
  haptic(r.done ? "medium" : "light");
  showToast(r.done ? "Лекция отмечена изученной" : "Отметка снята");
  openLecture(current);
}
function navLecture(id){
  if(id<1 || id>LECTURES.length) return;
  haptic("light");
  openLecture(id);
}
function goHome(){ haptic("light"); renderHome(); }

/* Прогресс чтения по скроллу */
let ticking = false;
function updateReadProgress(force){
  if(current===null) return;
  const h = document.documentElement;
  const max = h.scrollHeight - h.clientHeight;
  const pct = max>0 ? Math.min(100, Math.round((h.scrollTop / max)*100)) : 100;
  const r = getP(current);
  if(pct > (r.sp||0) && !r.done){
    r.sp = pct; store.p[current] = r; save();
  }
  const show = r.done ? 100 : Math.max(pct, Math.round(r.sp||0));
  const f = document.getElementById("lFill"), t = document.getElementById("lPct");
  if(f) f.style.width = show+"%";
  if(t) t.textContent = show+"%";
  if(force){ const tp = document.querySelector(".tb-pct"); if(tp) tp.textContent = show+"%"; }
}
window.addEventListener("scroll", ()=>{
  if(ticking) return; ticking = true;
  requestAnimationFrame(()=>{ updateReadProgress(); ticking=false; });
}, {passive:true});

/* Toast */
let toastTimer = null;
function showToast(msg){
  const t = document.getElementById("toast");
  t.innerHTML = icon("checkC",16) + msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove("show"), 2200);
}

}
function applyTgTheme(){
  if(!tg) return;
  const tp = tg.themeParams || {};
  const map = {
    bg_color:"--tg-theme-bg-color", text_color:"--tg-theme-text-color",
    hint_color:"--tg-theme-hint-color", link_color:"--tg-theme-link-color",
    button_color:"--tg-theme-button-color", button_text_color:"--tg-theme-button-text-color",
    secondary_bg_color:"--tg-theme-secondary-bg-color"
  };
  for(const k in map){ if(tp[k]) document.documentElement.style.setProperty(map[k], tp[k]); }
  document.documentElement.dataset.scheme = tg.colorScheme || "light";
  const mc = document.querySelector('meta[name="theme-color"]');
  if(mc) mc.content = tp.secondary_bg_color || tp.bg_color || "#2481cc";
}

if(tg){
  try{
    tg.ready();
    tg.expand();
    applyTgTheme();
    if(tg.onEvent) tg.onEvent("themeChanged", applyTgTheme);
    if(tg.BackButton && tg.BackButton.onClick) tg.BackButton.onClick(()=> goHome());
    if(tg.setHeaderColor){ try{ tg.setHeaderColor("secondary_bg_color"); }catch(e){} }
    if(tg.setBackgroundColor){ try{ tg.setBackgroundColor("bg_color"); }catch(e){} }
    if(tg.disableVerticalSwipes){ try{ tg.disableVerticalSwipes(); }catch(e){} }
  }catch(e){}
}

/* Старт */
renderHome();
</script>
</body>
</html>
